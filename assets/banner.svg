<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12161E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1C2536;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#264653;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF87;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#60EFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.5" />
    </filter>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="rgba(255,255,255,0.12)" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="10" />
  <rect width="100%" height="100%" fill="url(#dots)" rx="10" />
  <rect x="0" y="174" width="100%" height="6" fill="url(#accent)" rx="3" />
  <text x="400" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#FFFFFF" filter="url(#shadow)">
    DEARPYGUI CONSTRUCTOR
  </text>
  <text x="400" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#93C5FD">
    Visual Drag-and-Drop UI Builder &amp; Bidirectional AST Code Generator for DearPyGui
  </text>
</svg>
